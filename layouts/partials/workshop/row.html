<article class="workshop-row" data-categories="{{ delimit .Params.categories "|" | lower }}" data-search="{{ printf "%s %s %s %s" .Title (.Params.description | default .Params.subtitle | default "") (delimit .Params.categories " ") (delimit .Params.tags " ") | lower }}">
<a href="{{ .RelPermalink }}"><div><h3>{{ .Title }}</h3>{{ with .Params.description | default .Params.subtitle }}<p>{{ . }}</p>{{ end }}</div><div class="workshop-meta">{{ with .GetTerms "categories" }}<span class="workshop-topic">{{ (index . 0).LinkTitle }}</span>{{ end }}<time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "Jan 02" }}</time> · {{ .ReadingTime }} min</div></a>
</article>
